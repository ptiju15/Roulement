<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Constructeur de roulement</title><style>body{margin:0;background:#eef1f4;color:#26313b;font:14px Arial}header,.bar,.foot{background:#fff;border-bottom:1px solid #ccd3da;padding:14px 18px}h1{margin:0;font-size:21px}.sub{color:#697581;font-size:12px;margin-top:4px}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}input,button,select{font:inherit}input{width:65px;padding:6px;border:1px solid #b8c1c9;border-radius:5px}button{padding:7px 11px;border:1px solid #aeb7bf;background:#f8f9fa;border-radius:5px}main{padding:14px;overflow:auto}table{border-collapse:collapse;width:max-content;min-width:100%;background:#fff}th,td{border:1px solid #d4dbe1;text-align:center}th{height:34px;background:#e5e9ed;position:sticky;top:0}td{height:54px;min-width:125px}.week{min-width:55px;background:#f0f3f5;font-weight:bold}.weekend{background:#f5f7f8}td select{width:94%;height:34px;border:1px solid #c5cdd4;border-radius:4px;background:white}.rp{background:#e5f5e8!important}.rp select{background:#f0fbf2;border-color:#8fc69a}.foot{display:flex;gap:15px;flex-wrap:wrap;position:sticky;bottom:0}.card{padding:7px 10px;border:1px solid #d1d8de;border-radius:5px}.ok{color:#237a3b}.warn{color:#a46b00}</style></head><body><header><h1>Constructeur de roulement</h1><div class="sub">Cycle paramétrable · analyse annuelle</div></header><div class="bar">Nombre de lignes <input id="n" type="number" min="1" max="100" value="28" onchange="resize()"> Semaines <input id="w" type="number" min="1" max="104" value="52" onchange="calc()"><button onclick="demo()">Exemple</button><button onclick="empty()">Vider</button><button onclick="add()">+ Ligne</button><button onclick="del()">− Ligne</button><button onclick="csv()">CSV</button></div><main><table id="t"></table></main><div class="foot" id="f"></div><script>const D=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'],V=['','RP','S','C','AF1','AF2'];let A=Array.from({length:28},()=>Array(7).fill(''));function draw(){n.value=A.length;let s='<tr><th class=week>Ligne</th>'+D.map((x,i)=>'<th class='+(i>4?'weekend':'')+'>'+x+'</th>').join('')+'</tr>';A.forEach((r,i)=>{s+='<tr><td class=week>'+(i+1)+'</td>';r.forEach((v,j)=>{s+='<td id=c'+i+'_'+j+' class='+(j>4?'weekend':'')+'><select onchange="set('+i+','+j+',this.value)">'+V.map(x=>'<option value="'+x+'" '+(x==v?'selected':'')+'>'+((x)||'—')+'</option>').join('')+'</select></td>'});s+='</tr>'});t.innerHTML=s;calc()}function set(i,j,v){A[i][j]=v;document.getElementById('c'+i+'_'+j).classList.toggle('rp',v=='RP');calc()}function resize(){let x=Math.max(1,+n.value||1);while(A.length<x)A.push(Array(7).fill(''));while(A.length>x)A.pop();draw()}function add(){A.push(Array(7).fill(''));draw()}function del(){if(A.length>1)A.pop();draw()}function empty(){A=A.map(()=>Array(7).fill(''));draw()}function demo(){empty();[[3,4],[3,5],[3,6],[4,5],[4,6],[5,6],[6,0],[9,6],[10,0],[10,5],[10,6],[17,5],[17,6],[24,5],[24,6],[25,0]].forEach(x=>{if(A[x[0]])A[x[0]][x[1]]='RP'});draw()}function calc(){let N=Math.max(1,+w.value||52),Y=Array.from({length:N},(_,i)=>A[i%A.length]),rp=0,fs=0,sd=0,dl=0,att=0,tri=0;Y.forEach((r,i)=>{rp+=r.filter(x=>x=='RP').length;if(r[4]=='RP'&&r[5]=='RP')fs++;if(r[5]=='RP'&&r[6]=='RP')sd++;if(r[6]=='RP'&&i<N-1&&Y[i+1][0]=='RP')dl++;if(r[6]=='RP'&&(r[5]=='RP'||i<N-1&&Y[i+1][0]=='RP'))att++;if(r[4]=='RP'&&r[5]=='RP'&&r[6]=='RP')tri++});f.innerHTML='<span class=card>RP : <b>'+rp+'</b></span><span class=card>Ven+Sam : <b>'+fs+'</b></span><span class=card>Sam+Dim : <b>'+sd+'</b></span><span class=card>Dim+Lun : <b>'+dl+'</b></span><span class=card>Ven+Sam+Dim : <b>'+tri+'</b></span><span class=card>Dimanches accolés : <b>'+att+'</b></span><span class="card '+(sd>=12?'ok':'warn')+'">12 Sam-Dim : '+(sd>=12?'OK':'à vérifier')+'</span><span class="card '+(att>=22?'ok':'warn')+'">22 dimanches accolés : '+(att>=22?'OK':'à vérifier')+'</span>'}function csv(){let s='Ligne;'+D.join(';')+'\n';A.forEach((r,i)=>s+=(i+1)+';'+r.join(';')+'\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='roulement.csv';a.click()}draw();</script></body></html>
